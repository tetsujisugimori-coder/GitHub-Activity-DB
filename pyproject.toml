[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "github-activity-db"
version = "0.1.0"
description = "GitHubの公開活動をSQLiteへ蓄積して閲覧するローカルWebアプリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "mcp>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
github-activity-db = "github_activity_db.cli:main"
github-activity-db-mcp = "github_activity_db.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_activity_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.test-tmp -p no:cacheprovider"
